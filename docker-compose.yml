services:
  pulse-probe:
    # 直接拉取 GHCR 预构建镜像（amd64/arm64/armv7 多架构）
    # 如需本地构建：注释掉 image，改用 build: .
    image: ghcr.io/chinachat/pulse-linux-probe:latest
    ports:
      - "8080:8080"
    environment:
      PROBE_ADMIN_PASSWORD: ${PROBE_ADMIN_PASSWORD:?Set PROBE_ADMIN_PASSWORD in .env or the environment}
      PROBE_DATA_KEY: ${PROBE_DATA_KEY:?Set PROBE_DATA_KEY in .env or the environment}
      # 仅在部署了可信反向代理时开启；直连公网时开启会让攻击者可伪造
      # X-Forwarded-For 绕过登录限流（见 DEPLOY.md「反向代理」一节）
      PROBE_TRUST_PROXY: ${PROBE_TRUST_PROXY:-false}
      PROBE_PUBLIC_URL: ${PROBE_PUBLIC_URL:-https://probe.example.com}
    volumes:
      - probe-data:/data
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp

volumes:
  probe-data:
